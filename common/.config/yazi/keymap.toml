[mgr]

keymap = [
    # General
    { on = "<Esc>", run = "escape", desc = "Exit visual mode, clear selected, or cancel search" },
    { on = "q", run = "quit", desc = "Quit the process" },
    { on = "Q", run = "quit --no-cwd-file", desc = "Quit without outputting cwd-file" },
    { on = "<C-c>", run = "close", desc = "Close tab, or quit if last" },
    { on = "<C-z>", run = "suspend", desc = "Suspend the process" },
    { on = ";", run = "shell --interactive", desc = "Run shell command" },
    { on = ":", run = "shell --block --interactive", desc = "Run shell and wait" },
    { on = "~", run = "help", desc = "Open help" },
    { on = "<F1>", run = "help", desc = "Open help" },

    # Navigation
    { on = "k", run = "arrow -1", desc = "Move cursor up" },
    { on = "j", run = "arrow 1", desc = "Move cursor down" },
    { on = "<Up>", run = "arrow -1", desc = "Move cursor up" },
    { on = "<Down>", run = "arrow 1", desc = "Move cursor down" },
    { on = "<C-u>", run = "arrow -50%", desc = "Move cursor up half page" },
    { on = "<C-d>", run = "arrow 50%", desc = "Move cursor down half page" },
    { on = "<C-b>", run = "arrow -100%", desc = "Move cursor up one page" },
    { on = "<C-f>", run = "arrow 100%", desc = "Move cursor down one page" },
    { on = "<PageUp>", run = "arrow -100%", desc = "Page up" },
    { on = "<PageDown>", run = "arrow 100%", desc = "Page down" },
    { on = [ "g", "g" ], run = "arrow top", desc = "To top" },
    { on = "G", run = "arrow bot", desc = "To bottom" },
    { on = "h", run = "leave", desc = "Go up" },
    { on = "l", run = "enter", desc = "Enter directory or open file" },
    { on = "<Left>", run = "leave", desc = "Go up" },
    { on = "<Right>", run = "enter", desc = "Enter directory or open file" },
    { on = "H", run = "back", desc = "Go to previous dir" },
    { on = "L", run = "forward", desc = "Go to next dir" },
    { on = [ "g", "c" ], run = "cd ~/.config", desc = "Go to config dir" },
    { on = [ "g", "h" ], run = "cd ~", desc = "Go to home" },
    { on = [ "g", "d" ], run = "cd ~/Downloads", desc = "Go to Downloads" },
    { on = ["g", "."], run = "cd ~/dotfiles", desc = "Go to dotfiles"}, 


    # Search
    { on = "/", run = "find --smart", desc = "Find next match" },
    { on = "?", run = "find --previous --smart", desc = "Find previous match" },
    { on = "n", run = "find_arrow", desc = "Go to next result" },
    { on = "N", run = "find_arrow --previous", desc = "Go to previous result" },
    { on = "s",         run = "search --via=fd",             desc = "Search files by name via fd" },
    { on = "S",         run = "search --via=rg",             desc = "Search files by content via ripgrep" },
    { on = "z", run = "shell --block '~/.config/yazi/bin/zoxide_jump.sh'", desc = "Jump via Zoxide (Centered)" },
    { on = "f", run = "shell --block '$HOME/.config/yazi/bin/fzf_jump.sh'", desc = "Jump via fzf (Centered)" },
    { on = "<C-s>", run = "escape --search", desc = "Cancel search" },

    # Selection
    { on = "<Space>", run = ["toggle --state=none", "arrow 1"], desc = "Toggle selection" },
    { on = "v", run = "visual_mode", desc = "Enter visual mode" },
    { on = "V", run = "visual_mode --unset", desc = "Unset visual mode" },
    { on = "<C-a>", run = "toggle_all --state=true", desc = "Select all" },
    { on = "<C-r>", run = "toggle_all --state=none", desc = "Deselect all" },

    # File Operations
    { on = "o", run = "open", desc = "Open file(s)" },
    { on = "O", run = "open --interactive", desc = "Open interactively" },
    { on = "<Enter>", run = "open", desc = "Open file(s)" },
    { on = "<S-Enter>", run = "open --interactive", desc = "Open interactively" },
    { on = "y", run = "yank", desc = "Copy" },
    { on = "x", run = "yank --cut", desc = "Cut" },
    { on = "p", run = "paste", desc = "Paste" },
    { on = "P", run = "paste --force", desc = "Paste (force overwrite)" },
    { on = "-", run = "link", desc = "Symlink absolute" },
    { on = "_", run = "link --relative", desc = "Symlink relative" },
    { on = "<C-->", run = "hardlink", desc = "Hardlink" },
    { on = "Y", run = "unyank", desc = "Cancel yank" },
    { on = "X", run = "unyank", desc = "Cancel yank" },
    { on = "d", run = "remove", desc = "Trash file(s)" },
    { on = "D", run = "remove --permanently", desc = "Delete permanently" },
    { on = "a", run = "create", desc = "Create file/dir" },
    { on = "r", run = "rename --cursor=before_ext", desc = "Rename selected file(s)" },

    # Copy to Clipboard
    { on = [ "c", "c" ], run = "copy path", desc = "Copy full path" },
    { on = [ "c", "d" ], run = "copy dirname", desc = "Copy directory name" },
    { on = [ "c", "a" ], run = "copy filename", desc = "Copy filename" },
    { on = [ "c", "n" ], run = "copy name_without_ext", desc = "Copy filename (no extension)" },
    { on = [ "c", "z" ], run = ["shell '~/.config/yazi/bin/zip.sh %s' "], desc = "Create zip of current dir and copy to clipboard" },
    # File Display & Sorting
    { on = [ "m", "s" ], run = "linemode size", desc = "Show size" },
    { on = [ "m", "p" ], run = "linemode permissions", desc = "Show permissions" },
    { on = [ "m", "c" ], run = "linemode ctime", desc = "Show ctime" },
    { on = [ "m", "m" ], run = "linemode mtime", desc = "Show mtime" },
    { on = [ "m", "o" ], run = "linemode owner", desc = "Show owner" },
    { on = [ "m", "n" ], run = "linemode none", desc = "Hide metadata" },
    { on = ".", run = "hidden toggle", desc = "Toggle hidden files" },
    { on = [ ",", "m" ], run = ["sort modified --reverse=no", "linemode mtime"], desc = "Sort by modified time" },
    { on = [ ",", "M" ], run = ["sort modified --reverse", "linemode mtime"], desc = "Sort by modified time (desc)" },
    # It should use btime, birth time not whatever it used before
    { on = [ ",", "c" ], run = ["sort btime --reverse=no", "linemode btime"], desc = "Sort by created time" }, 
    { on = [ ",", "C" ], run = ["sort btime --reverse", "linemode btime"], desc = "Sort by created time (desc)" },
    { on = [ ",", "a" ], run = "sort alphabetical --reverse=no", desc = "Sort A-Z" },
    { on = [ ",", "A" ], run = "sort alphabetical --reverse", desc = "Sort Z-A" },
    { on = [ ",", "s" ], run = ["sort size --reverse=no", "linemode size"], desc = "Sort by size" },
    { on = [ ",", "S" ], run = ["sort size --reverse", "linemode size"], desc = "Sort by size (desc)" },
    { on = [ ",", "r" ], run = "sort random --reverse=no", desc = "Random sort" },
    { on = [ ",", "t" ], run = "sort extension --reverse=no", desc = "Sort by type (A-Z)" },
    { on = [ ",", "T" ], run = "sort extension --reverse",    desc = "Sort by type (Z-A)" },
    
    # Tab Management
    { on = "t", run = "tab_create --current", desc = "New tab (CWD)" },
    { on = "1", run = "tab_switch 0", desc = "Go to tab 1" },
    { on = "2", run = "tab_switch 1", desc = "Go to tab 2" },
    { on = "3", run = "tab_switch 2", desc = "Go to tab 3" },
    { on = "4", run = "tab_switch 3", desc = "Go to tab 4" },
    { on = "[", run = "tab_switch -1 --relative", desc = "Previous tab" },
    { on = "]", run = "tab_switch 1 --relative", desc = "Next tab" },
    
    # Task Manager
    { on = "w", run = "tasks_show", desc = "Show task manager" },
]


[[mgr.prepend_keymap]]
on = ["c", "f"]
run = '''
    shell 'ripdrag -x -A %s &' 
'''
desc = "Drag-out (Exportar)"
