[main]
term=xterm-256color
font=JetBrainsMono Nerd Font Mono:size=14
dpi-aware=no
pad=10x10

include=~/.cache/wal/colors-foot.ini

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors]
alpha=1

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
primary-paste=Shift+Insert

font-increase=Control+Shift+plus Control+plus
font-decrease=Control+Shift+minus Control+minus
font-reset=Control+Shift+BackSpace

scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-home=Shift+Home
scrollback-end=Shift+End
