[main]
term=foot
login-shell=no
font=JetBrainsMono Nerd Font:size=14,Symbols Nerd Font:size=14,Noto Color Emoji:size=14
dpi-aware=no
resize-by-cells=yes
resize-keep-grid=yes
pad=10x10

[colors]
alpha=0.8
background=191724
foreground=e0def4
flash=eb6f92
flash-alpha=0.5

selection-foreground={foreground}
selection-background={background}

# ANSI colors
regular0={color0}
regular1={color1}
regular2={color2}
regular3={color3}
regular4={color4}
regular5={color5}
regular6={color6}
regular7={color7}

bright0={color8}
bright1={color9}
bright2={color10}
bright3={color11}
bright4={color12}
bright5={color13}
bright6={color14}
bright7={color15}

[key-bindings]
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
primary-paste=Shift+Insert
search-start=Control+Shift+r
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+o

