# URL Handling
open_url_with default

# Clipboard Integration
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+s paste_from_selection
map ctrl+shift+c copy_to_clipboard
map shift+insert paste_from_selection

# Font Size Controls
map ctrl+plus increase_font_size
map ctrl+minus decrease_font_size
map ctrl+backspace restore_font_size

# Opacity Control
map ctrl+shift+plus set_background_opacity +0.1
map ctrl+shift+minus set_background_opacity -0.1

# Remove useless keybinds
map ctrl+shift+h no_op 
map ctrl+shift+enter no_op 
map ctrl+shift+n no_op 
map ctrl+shift+/ no_op
