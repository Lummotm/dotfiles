set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -gw automatic-rename off

set -g status-style "bg=default,fg=default"
set -g window-status-style "bg=default,fg=default"
set -g window-status-current-style "bg=default,fg=default"

set -g status-left ""
set -g status-right ""
set -g window-status-separator " "

set -g window-status-format         "#[fg=colour8]●"
set -g window-status-current-format "#[fg=#{?#{||:#{client_prefix},#{pane_in_mode}},colour3,colour4},bold]●"
