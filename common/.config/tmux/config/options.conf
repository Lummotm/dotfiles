# Tmux options configuration

# Window and pane numbering: Start at 1 for natural keyboard access
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g @resize_mode ""

# History and performance: Large scrollback, no escape delay for Vim
set -g history-limit 10000
set -sg escape-time 0

# Terminal: Enable 256 colors and true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse: Enable mouse support for pane/window selection and resizing
set -g mouse off

# Focus events: Report focus changes to Neovim for autoread
set -g focus-events on
set -g status-interval 1

# Window notifications: Disable visual alerts
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Passthrough: Allow escape sequences to pass through to Neovim plugins
set -g allow-passthrough on
