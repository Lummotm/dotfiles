[shell]
avatar_path = "/home/davidn/Pictures/Beibis/IMG-20260622-WA0001.jpg"
font_family = "JetBrainsMono Nerd Font Propo"
niri_overview_type_to_launch_enabled = true
settings_window_translucent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.mpris]
    blacklist = [ "firefox" ]

    [shell.panel]
    clipboard_placement = "attached"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "default"

[theme]
builtin = "Rosé Pine"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"
