# Environment variables
$terminal = kitty
$terminal2 = foot
$fileManager = thunar
$browser = zen-browser
$mainMod = Meta # The main modifier key (Super/Windows key)


# Launchers and utilities
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Q, exec, $terminal --title=tmux -e ~/.config/tmux/bin/rofi-tmux.sh
bind = $mainMod ctrl alt, Q, exec, $terminal
bind = $mainMod alt, Q, exec, $terminal
bind = $mainMod, R, exec, sys-menu launcher --rofi
bind = $mainMod shift, R, exec, sys-menu launcher --rofi
bind = $mainMod, W, exec, $browser
# Using notifications for system status
# bind = $mainMod, A, exec, pkill waybar || waybar
bind = $mainMod, A, exec, ~/bin/ui/notify-sys.sh
bind = $mainMod shift, A, exec, sys-menu wallpaper --rofi
bind = $mainMod shift alt,  A, exec, ~/bin/ui/wallpaper-handler.sh toggle
bind = $mainMod shift, B, exec, sys-menu bluetooth --rofi
bind = $mainMod shift, W, exec, sys-menu network --rofi
bind = $mainMod shift, L, exec, ~/.config/hypr/bin/art.sh && hyprlock
bind = $mainMod shift, C, exec, sys-menu power --rofi
bind = $mainMod shift, S, exec, sys-menu audio --rofi
bind = $mainMod shift, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod shift alt, Q, exit
bind = $mainMod, N, exec,  $terminal --title=nvim -e /usr/bin/nvim
bind = $mainMod, H, setprop, active opaque toggle
 
# Window management
bind = $mainMod, C, killactive
bind = $mainMod alt, C, exec, tmux kill-server
bind = $mainMod, O, togglesplit
bind = $mainMod, P, swapsplit
bind = $mainMod, S, togglespecialworkspace
bind = $mainMod alt, S, movetoworkspace, special
bind = $mainMod, D, togglespecialworkspace, gaming
bind = $mainMod alt, D, movetoworkspace, special:gaming


bind = $mainMod, V, exec, ~/.config/hypr/bin/float-resize.sh
bind = , F11, fullscreen
# Start Recording
bind = ,F12, exec, bash -c 'hyprctl dispatch pass "class:^(com\.obsproject\.Studio)$" && { [[ -f /tmp/obs ]] && rm /tmp/obs && notify-send "OBS" "🛑 Recoring stopped " || { touch /tmp/obs && notify-send "OBS" "🔴 Recording started "; }; }'



# Focus movement (Vim style)
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# Workspaces
# Switch to workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod alt, 1, movetoworkspace, 1
bind = $mainMod alt, 2, movetoworkspace, 2
bind = $mainMod alt, 3, movetoworkspace, 3
bind = $mainMod alt, 4, movetoworkspace, 4
bind = $mainMod alt, 5, movetoworkspace, 5
bind = $mainMod alt, 6, movetoworkspace, 6
bind = $mainMod alt, 7, movetoworkspace, 7
bind = $mainMod alt, 8, movetoworkspace, 8
bind = $mainMod alt, 9, movetoworkspace, 9
bind = $mainMod alt, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Resize windows
bind = ctrl alt, h, resizeactive, -20 0
bind = ctrl alt, j, resizeactive, 0 20
bind = ctrl alt, k, resizeactive, 0 -20
bind = ctrl alt, l, resizeactive, 20 0

# Mouse actions
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimedia keys
bindel = , XF86AudioRaiseVolume, exec, ~/bin/ui/notify-send.sh volume_up || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, ~/bin/ui/notify-send.sh volume_down || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, ~/bin/ui/notify-send.sh volume_mute || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, ~/bin/ui/notify-send.sh mic_mute || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, ~/bin/ui/notify-send.sh brightness_up || brightnessctl s 5.0%+
bindel = , XF86MonBrightnessDown, exec, ~/bin/ui/notify-send.sh brightness_down || brightnessctl s 5.0%-

# Screenshots
bind = , PRINT, exec, ~/.config/hypr/bin/hyprshot-full.sh
bind = $mainMod, PRINT, exec, ~/.config/hypr/bin/hyprshot-region.sh

# Other utilities
bind = , F8, exec, sh ~/bin/sys/touchpad-toggle.sh
bind = $mainMod shift, F9, exec, ~/bin/sys/monitor-toggle.sh
bind = $mainMod alt, R, exec, sh ~/bin/sys/rotate-monitor.sh
