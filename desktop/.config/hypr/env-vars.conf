# VULKAN-WAYLAND FIX
env = VK_ICD_FILENAMES,/usr/share/vulkan/icd.d/radeon_icd.x86_64.json:/usr/share/vulkan/icd.d/radeon_icd.i686.json
env = DISABLE_LAYER_AMD_SWITCHABLE_GRAPHICS_1,1

# CORE VARIABLES
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# WAYLAND ESSENTIALS
env = WAYLAND_DISPLAY,wayland-1
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland,x11
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = EGL_PLATFORM,wayland

# AMD GPU CONFIGURATION
env = LIBVA_DRIVER_NAME,radeonsi
env = __GLX_VENDOR_LIBRARY_NAME,mesa
env = __GL_VENDOR_LIBRARY_NAME,mesa
env = AMD_VULKAN_ICD,RADV
env = RADV_PERFTEST,aco,sam

# GAMESCOPE & STEAM
env = GAMESCOPE_VK_WSI,wayland
env = WLR_NO_HARDWARE_CURSORS,0

# CURSOR THEME
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,20
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,20

