# Hyprland XDG specifications
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Main GPU: NVIDIA
# env = WLR_DRM_DEVICES,/dev/dri/card0
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = __GL_VENDOR_LIBRARY_NAME,nvidia
#
# NVIDIA Wayland configuration
# env = NVIDIA_DRIVER_CAPABILITIES,all
#
# Disable auto offload
# env = __NV_PRIME_RENDER_OFFLOAD,0

# Electron without acceleration
env = ELECTRON_DISABLE_GPU,1
env = ELECTRON_ENABLE_CPU_RENDERING,1

# Cursor configuration
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,20


# Env vars for OBS
env = QT_QPA_PLATFORM,wayland
