$font = JetBrains Mono
source = ~/.cache/wal/pywal-hypr.conf


# BACKGROUND
background {
    monitor =
    path = ~/Pictures/Wallpapers/tmp.png
    blur_passes = 2
    contrast = 1
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = false
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.3
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgb(209, 207, 207)
    fade_on_empty = true
    rounding = 32
    fail_color = rgba(191, 97, 106, 0.75)
    check_color = rgba(235, 203, 139, 0.75)
    placeholder_text = 
    hide_input = false
    position = 0, 200
    halign = center
    valign = bottom
}


# TIME - HOURS
label {
    monitor = 
    text = cmd[update:1000] echo "$(date +"%H")"
    color = 0xff$color5
    font_size = 160
    font_family = $font Extrabold
    position = 0, 100
    halign = center
    valign = center
}

# TIME - MINUTES  
label {
    monitor = 
    text = cmd[update:1000] echo "$(date +"%M")"
    color = 0xff$color5
    font_size = 160
    font_family = $font Extrabold
    position = 0, -100
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = 0xff$color5
    font_size = 20
    font_family = $font Italic Bold
    position = 0, 300
    halign = center
    valign = bottom
}



# Music
image {
    monitor = 
    size = 128
    rounding = -1
    border_size = 0
    rotate = 0
    reload_time = 1 
    path = /tmp/current.png
    reload_cmd = ~/.config/hypr/bin/art.sh
    position = 40, -40
    halign = left
    valign = top
    opacity = 1
}

label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/bin/songdetail.sh --title)" 
    color = rgba(209, 207, 207, 0.75)
    #color = rgba(255, 255, 255, 0.6)
    font_size = 15 
    font_family = $font bold italic
    position = 190, -100
    halign = left
    valign = top 

}

label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/bin/songdetail.sh --artist)" 
    color = rgba(209, 207, 207, 0.75)
    #color = rgba(255, 255, 255, 0.6)
    font_size = 13  
    font_family = $font bold italic
    position = 190, -80
    halign = left
    valign = top 
}

