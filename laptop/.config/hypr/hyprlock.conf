# Network and hotspot
label {
    monitor =
    text = cmd[update:5000] echo "$(~/.config/hypr/bin/hotspot.sh)"
    color = rgba(209, 207, 207, 0.75)
    font_size = 14
    font_family = $font
    position = -40, -10
    halign = right
    valign = top
}



label {
    monitor =
    text = cmd[update:5000] echo "$(~/.config/hypr/bin/network.sh)"
    color = rgba(209, 207, 207, 0.75)
    font_size = 14
    font_family = $font
    position = 0, -10
    halign = right
    valign = top
}

