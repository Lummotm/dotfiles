# BACKGROUND
background {
    monitor =
    path = ~/Pictures/Wallpapers/current-wallpaper.png
    blur_passes = 2
    contrast = 1
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = false
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgb(209, 207, 207)
    fade_on_empty = false
    rounding = 32
    fail_color = rgba(191, 97, 106, 0.75)
    check_color = rgba(235, 203, 139, 0.75)
    placeholder_text = <span foreground="##cdd6f4">Input Password...</span>
    hide_input = false
    position = 0, -400
    halign = center
    valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = rgba(209, 207, 207, 0.75)
  font_size = 22
  font_family = JetBrains Mono
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%-H:%M")"
  color = rgba(209, 207, 207, 0.75)
  font_size = 95
  font_family = JetBrains Mono Extrabold
  position = 0, 200
  halign = center
  valign = center
}

# Music
image {
    monitor = 
    size = 256
    rounding = 6
    border_size = 0
    rotate = 0
    reload_time = 1 
    path = /tmp/current.png
    reload_cmd = ~/.config/hypr/bin/art.sh
    position = 0, -25
    halign = center
    valign = center
    opacity = 1
}

label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/bin/songdetail.sh --title)" 
    color = rgba(209, 207, 207, 0.75)
    #color = rgba(255, 255, 255, 0.6)
    font_size = 17  
    font_family = JetBrains Mono
    position = 0, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/bin/songdetail.sh --artist)" 
    color = rgba(209, 207, 207, 0.75)
    #color = rgba(255, 255, 255, 0.6)
    font_size = 15  
    font_family = Source Code Pro
    position = 0, -230
    halign = center
    valign = center
}

# Network and hotspot
label {
    monitor =
    text = cmd[update:5000] echo "$(~/.config/hypr/bin/hotspot.sh)"
    color = rgba(209, 207, 207, 0.75)
    font_size = 14
    font_family = JetBrains Mono 
    position = -40, -10
    halign = right
    valign = top
}



label {
    monitor =
    text = cmd[update:5000] echo "$(~/.config/hypr/bin/network.sh)"
    color = rgba(209, 207, 207, 0.75)
    font_size = 14
    font_family = JetBrains Mono 
    position = 0, -10
    halign = right
    valign = top
}

